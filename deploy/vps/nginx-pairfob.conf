# /etc/nginx/sites-available/pairfob -> sites-enabled. Origin listens on 127.0.0.1:18786.
map $http_upgrade $pairfob_connection {
	default upgrade;
	''      close;
}

server {
	server_name pairfob.bin-ary.de;
	listen 80;
	listen [::]:80;

	location /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	server_name pairfob.bin-ary.de;
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	ssl_certificate /etc/letsencrypt/live/pairfob.bin-ary.de/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pairfob.bin-ary.de/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:18786;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $pairfob_connection;
		proxy_set_header Host $host;
		# The Worker keys rate limits on this header; never pass a client's own.
		proxy_set_header CF-Connecting-IP $remote_addr;
		proxy_buffering off;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
